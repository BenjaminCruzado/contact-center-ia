services:
  api:
    container_name: contact-center-api
    build:
      context: .
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

