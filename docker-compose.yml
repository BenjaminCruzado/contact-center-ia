services:
  api:
    container_name: contact-center-api
    build:
      context: .
      target: production
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434/api
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      HOME: /home/appuser
      XDG_CACHE_HOME: /models/.cache
      HF_HOME: /models/.cache/huggingface
      HF_HUB_DISABLE_XET: "1"
      SENTENCE_TRANSFORMERS_HOME: /models/sentence-transformers
      WHISPER_CACHE_DIR: /models/whisper
      AUDIT_DB_PATH: /data/audit.db
    depends_on:
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - embedding-models:/models
      - audit-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: contact-center-ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: contact-center-ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: contact-center-chroma
    ports:
      - "${CHROMA_HOST_PORT:-8001}:8000"
    volumes:
      - chroma-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "echo > /dev/tcp/127.0.0.1/8000",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  frontend:
    image: nginx:1.27-alpine
    container_name: contact-center-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  chroma-data:
  embedding-models:
  audit-data:
  ollama-models:
