services:
  api:
    container_name: contact-center-api
    build:
      context: .
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      HOME: /home/appuser
      XDG_CACHE_HOME: /models/.cache
      HF_HOME: /models/.cache/huggingface
      HF_HUB_DISABLE_XET: "1"
      SENTENCE_TRANSFORMERS_HOME: /models/sentence-transformers
    depends_on:
      chroma:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - embedding-models:/models
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: contact-center-chroma
    ports:
      - "${CHROMA_HOST_PORT:-8001}:8000"
    volumes:
      - chroma-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "echo > /dev/tcp/127.0.0.1/8000",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  chroma-data:
  embedding-models:
